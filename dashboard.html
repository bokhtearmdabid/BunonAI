<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BunonAI – Factory Dashboard</title>
<style>
:root {
  --bg: #f3f5fa;
  --card: #fff;
  --text: #161b26;
  --muted: #667085;
  --line: #e6e9f0;
  --red: #e5484d;
  --amber: #f59e0b;
  --green: #12b76a;
  --blue: #4f7cff;
  --teal: #14b8c4;
  --violet: #8b5cf6;
  --redbg: #fff1f1;
  --ambbg: #fff8e6;
  --grnbg: #e9f9f0;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017;
    --card: #161b25;
    --text: #eef1f6;
    --muted: #9aa4b5;
    --line: #262d3a;
    --redbg: #2b1416;
    --ambbg: #2a2111;
    --grnbg: #0f2519;
    --shadow: none;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1017;
  --card: #161b25;
  --text: #eef1f6;
  --muted: #9aa4b5;
  --line: #262d3a;
  --redbg: #2b1416;
  --ambbg: #2a2111;
  --grnbg: #0f2519;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.logo { font-weight: 800; font-size: 18px; letter-spacing: -.2px; }
.logo span { color: var(--blue); }
.pill {
  display: inline-flex; gap: 6px; align-items: center;
  padding: 4px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}

/* Welcome banner */
.welcome {
  background: linear-gradient(135deg, #1e3a8a, #4f7cff 60%, #14b8c4);
  color: #fff; border-radius: 18px; padding: 22px; box-shadow: var(--shadow);
}
.welcome h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.3px; }
.welcome p { margin: 4px 0; opacity: .95; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chips span { background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px 12px; font-size: 12px; }

/* Typography and cards */
h2 { font-size: 15px; margin: 0 0 2px; }
.sec { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 26px 0 8px; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.g2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); margin-top: 12px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 12px; }
.kpi .ic { font-size: 20px; }
.big { font-size: 28px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; }
.lbl { color: var(--muted); font-size: 12px; }
.sub { color: var(--muted); font-size: 12.5px; }

/* Risk hero card */
.hero {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center;
  border-left: 7px solid var(--c); background: var(--b); margin-top: 12px;
}
.red   { --c: var(--red);   --b: var(--redbg); }
.amber { --c: var(--amber); --b: var(--ambbg); }
.green { --c: var(--green); --b: var(--grnbg); }
.hero .big { color: var(--c); }
.tip { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 13px; }

/* Horizontal bar rows */
.row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
.row .n { width: 38%; min-width: 96px; }
.row .t { flex: 1; background: var(--line); border-radius: 8px; height: 12px; overflow: hidden; }
.row .t i { display: block; height: 100%; border-radius: 8px; }
.row .v { width: 58px; text-align: right; font-weight: 600; }

/* Donut and legend */
.donut { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.dl div { font-size: 13px; margin: 5px 0; }
.dl b, .leg b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.leg span { display: inline-block; margin-right: 12px; font-size: 12px; color: var(--muted); }

/* Action list */
.acts { list-style: none; margin: 8px 0 0; padding: 0; }
.acts li { display: flex; gap: 10px; padding: 10px; border-radius: 12px; background: var(--bg); margin-bottom: 8px; font-size: 14px; }
.acts li b {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px;
}

/* Tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tag { padding: 2px 10px; border-radius: 999px; font-size: 12px; color: #fff; }
.tag.red { background: var(--red); }
.tag.amber { background: var(--amber); }

pre { white-space: pre-wrap; font: inherit; margin: 8px 0 0; }

footer { margin: 30px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; text-align: center; }
footer strong { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">🏭 Bunon<span>AI</span></div>
    <div class="pill" id="asof"></div>
  </div>

  <div id="app"></div>

  <footer>
    <div><strong>BunonAI</strong> · Virtual operations manager for garment factories</div>
    <div>Agents: Production · Quality · Supplier · Export Deadline</div>
    <div id="gen"></div>
    <div style="margin-top:6px">
      Numbers are calculated by code. AI only helps write the language.
      Loss reasons are estimates. Current data is sample data.
    </div>
  </footer>
</div>

<script>
/* The Python script replaces {"latest": {"as_of": "2026-11-10", "orders": [{"order": "PO-2330", "style": "Polo-Shirt-Black", "order_qty": 6000, "ship_date": "2026-11-15", "sewing_deadline": "2026-11-14", "ship_risk": "🚨 VERY HIGH", "projected_ready": 4713, "shortfall": 1287, "produced": 2681, "needed_per_day": 730, "current_per_day": 606, "efficiency_pct": 74.4, "main_loss_reasons_pieces": {"absenteeism": 178, "slow_speed_other": 286, "downtime_Machine breakdown": 64, "downtime_Waiting for trims": 64, "downtime_Power cut": 34}, "quality": {"status": "GREEN", "recent_dhu": 2.69, "target_dhu": 3.0, "expected_defects_in_remaining": 89}, "material_problems": [{"item": "Buttons 4-hole black", "supplier": "Dhaka Trims", "status": "LATE", "balance": 2700, "unit": "pcs", "note": "ETA 2026-11-12 is 1 day(s) AFTER it is needed (2026-11-11); also 2 day(s) past promised date"}], "pieces_lost_waiting_material": 187, "options_remaining_shortfall": {"2h_overtime_per_day": 833, "work_friday": 681, "friday_plus_2h_overtime": 75, "friday_plus_3h_overtime": 0}}]}, "brief": "PO-2330 (Polo-Shirt-Black) এর ship risk 🚨 VERY HIGH, sewing deadline 2026-11-14 এর মধ্যে projected shortfall 1287 pcs।\n\nলসের মূল কারণ:\n- Production: Current 606 pcs/day চলছে (needed 730 pcs/day); slow speed-এ প্রায় 286 pcs এবং absenteeism-এ প্রায় 178 pcs লস হয়েছে।\n- Material: Supplier Dhaka Trims থেকে Buttons 4-hole black late (balance 2700 pcs), ETA 2026-11-12 যা needed date 2026-11-11 এর পরে।\n- Quality: Status GREEN, recent DHU 2.69 (target 3.0)।\n\nTOP 3 ACTIONS for today:\n1. Daily 2h overtime: shortfall কমে 833 pcs হবে, trade-off হলো overtime cost বাড়বে।\n2. Work Friday: shortfall কমে 681 pcs হবে, trade-off হলো off-day work allowance ও worker fatigue।\n3. Friday plus 3h overtime: shortfall 0 pcs হবে, trade-off হলো high overtime cost ও severe fatigue।\n\nShortfall মেটাতে আপনি কি Friday work নাকি Friday plus overtime অপশন approve করবেন?", "series": {"PO-2330": [{"date": "11-05", "planned": 815, "actual": 659, "defects": 25, "lines": 3}, {"date": "11-07", "planned": 815, "actual": 657, "defects": 18, "lines": 3}, {"date": "11-08", "planned": 815, "actual": 593, "defects": 19, "lines": 3}, {"date": "11-09", "planned": 815, "actual": 569, "defects": 12, "lines": 3}, {"date": "11-10", "planned": 288, "actual": 203, "defects": 6, "lines": 1}]}, "lineEff": {"PO-2330": {"Line-1": 71.2, "Line-2": 77.0, "Line-3": 80.1}}, "history": {"PO-2330": [{"date": "2026-11-10", "shortfall": 1287}]}, "generated": "18 Oct 2026, 18:11", "total_lines": 3} with a JSON object. */
const D = {"latest": {"as_of": "2026-11-10", "orders": [{"order": "PO-2330", "style": "Polo-Shirt-Black", "order_qty": 6000, "ship_date": "2026-11-15", "sewing_deadline": "2026-11-14", "ship_risk": "🚨 VERY HIGH", "projected_ready": 4713, "shortfall": 1287, "produced": 2681, "needed_per_day": 730, "current_per_day": 606, "efficiency_pct": 74.4, "main_loss_reasons_pieces": {"absenteeism": 178, "slow_speed_other": 286, "downtime_Machine breakdown": 64, "downtime_Waiting for trims": 64, "downtime_Power cut": 34}, "quality": {"status": "GREEN", "recent_dhu": 2.69, "target_dhu": 3.0, "expected_defects_in_remaining": 89}, "material_problems": [{"item": "Buttons 4-hole black", "supplier": "Dhaka Trims", "status": "LATE", "balance": 2700, "unit": "pcs", "note": "ETA 2026-11-12 is 1 day(s) AFTER it is needed (2026-11-11); also 2 day(s) past promised date"}], "pieces_lost_waiting_material": 187, "options_remaining_shortfall": {"2h_overtime_per_day": 833, "work_friday": 681, "friday_plus_2h_overtime": 75, "friday_plus_3h_overtime": 0}}]}, "brief": "PO-2330 (Polo-Shirt-Black) এর ship risk 🚨 VERY HIGH, sewing deadline 2026-11-14 এর মধ্যে projected shortfall 1287 pcs।\n\nলসের মূল কারণ:\n- Production: Current 606 pcs/day চলছে (needed 730 pcs/day); slow speed-এ প্রায় 286 pcs এবং absenteeism-এ প্রায় 178 pcs লস হয়েছে।\n- Material: Supplier Dhaka Trims থেকে Buttons 4-hole black late (balance 2700 pcs), ETA 2026-11-12 যা needed date 2026-11-11 এর পরে।\n- Quality: Status GREEN, recent DHU 2.69 (target 3.0)।\n\nTOP 3 ACTIONS for today:\n1. Daily 2h overtime: shortfall কমে 833 pcs হবে, trade-off হলো overtime cost বাড়বে।\n2. Work Friday: shortfall কমে 681 pcs হবে, trade-off হলো off-day work allowance ও worker fatigue।\n3. Friday plus 3h overtime: shortfall 0 pcs হবে, trade-off হলো high overtime cost ও severe fatigue।\n\nShortfall মেটাতে আপনি কি Friday work নাকি Friday plus overtime অপশন approve করবেন?", "series": {"PO-2330": [{"date": "11-05", "planned": 815, "actual": 659, "defects": 25, "lines": 3}, {"date": "11-07", "planned": 815, "actual": 657, "defects": 18, "lines": 3}, {"date": "11-08", "planned": 815, "actual": 593, "defects": 19, "lines": 3}, {"date": "11-09", "planned": 815, "actual": 569, "defects": 12, "lines": 3}, {"date": "11-10", "planned": 288, "actual": 203, "defects": 6, "lines": 1}]}, "lineEff": {"PO-2330": {"Line-1": 71.2, "Line-2": 77.0, "Line-3": 80.1}}, "history": {"PO-2330": [{"date": "2026-11-10", "shortfall": 1287}]}, "generated": "18 Oct 2026, 18:11", "total_lines": 3};
const TL = D.total_lines;

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Number(n).toLocaleString("en-US");

const risk = r =>
  r.includes("LOW")    ? ["green", "LOW", "🟢"] :
  r.includes("MEDIUM") ? ["amber", "MEDIUM", "🟡"] :
  r.includes("VERY")   ? ["red", "VERY HIGH", "🚨"] :
                         ["red", "HIGH", "🔴"];

const nice = k =>
  k.replace("downtime_", "Downtime: ")
   .replace(/_/g, " ")
   .replace(/^./, c => c.toUpperCase());

const PAL = ["#4f7cff", "#8b5cf6", "#14b8c4", "#f59e0b", "#e5484d", "#12b76a"];

const hr = new Date().getHours();
const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";

const col = v => v < 70 ? "var(--red)" : v < 85 ? "var(--amber)" : "var(--green)";

/* ---------- Charts ---------- */
function donut(parts, big, small) {
  const R = 54, C = 2 * Math.PI * R;
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
  let off = 0;

  const arcs = parts.map(p => {
    const len = p.v / tot * C;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" style="stroke:${p.c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len;
    return s;
  }).join("");

  return `<div class="donut">
    <svg viewBox="0 0 140 140" width="150" height="150" role="img">
      <circle r="${R}" cx="70" cy="70" fill="none" style="stroke:var(--line)" stroke-width="22"/>
      ${arcs}
      <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--text)">${big}</text>
      <text x="70" y="85" text-anchor="middle" font-size="10" style="fill:var(--muted)">${small}</text>
    </svg>
    <div class="dl">${parts.map(p => `<div><b style="background:${p.c}"></b>${esc(p.l)}: <strong>${fmt(p.v)}</strong></div>`).join("")}</div>
  </div>`;
}

function line(pts, o) {
  const W = 420, Hh = 190;
  const p = { l: 38, r: 12, t: 14, b: 26 };
  const iw = W - p.l - p.r, ih = Hh - p.t - p.b;
  const ymax = o.max ?? (Math.max(...pts.map(q => q.y), o.ref || 0) * 1.15 || 1);
  const ymin = o.min ?? 0;
  const X = i => p.l + (pts.length > 1 ? i * iw / (pts.length - 1) : iw / 2);
  const Y = v => p.t + ih - ih * (v - ymin) / (ymax - ymin || 1);
  let g = "";

  for (let i = 0; i <= 3; i++) {
    const v = ymin + (ymax - ymin) * i / 3;
    g += `<line x1="${p.l}" x2="${W - p.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/>
          <text x="${p.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${o.f ? o.f(v) : Math.round(v)}</text>`;
  }

  if (o.ref != null) {
    g += `<line x1="${p.l}" x2="${W - p.r}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke-dasharray="5 4" style="stroke:var(--amber)"/>
          <text x="${W - p.r}" y="${Y(o.ref) - 4}" text-anchor="end" font-size="10" style="fill:var(--amber)">${o.rl}</text>`;
  }

  g += `<path d="${pts.map((q, i) => (i ? "L" : "M") + X(i) + "," + Y(q.y)).join(" ")}" fill="none" style="stroke:${o.c}" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += pts.map((q, i) =>
    `<circle cx="${X(i)}" cy="${Y(q.y)}" r="4" style="fill:${o.c}"/>
     <text x="${X(i)}" y="${Hh - 8}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${q.x}</text>`
  ).join("");

  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img">${g}</svg>`;
}

function bars2(s) {
  const W = 480, H = 210;
  const p = { l: 40, r: 8, t: 10, b: 26 };
  const iw = W - p.l - p.r, ih = H - p.t - p.b;
  const max = Math.max(...s.map(d => Math.max(d.planned, d.actual)), 1);
  const y = v => p.t + ih - ih * v / max;
  const bw = iw / s.length;
  let g = "";

  for (let i = 0; i <= 3; i++) {
    const v = max * i / 3;
    g += `<line x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/>
          <text x="${p.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(v)}</text>`;
  }

  s.forEach((d, i) => {
    const x = p.l + i * bw, w = bw * .34, partial = d.lines < TL;
    g += `<rect x="${x + bw * .12}" y="${y(d.planned)}" width="${w}" height="${p.t + ih - y(d.planned)}" rx="3" style="fill:var(--line)"/>
          <rect x="${x + bw * .12 + w + 2}" y="${y(d.actual)}" width="${w}" height="${p.t + ih - y(d.actual)}" rx="3" style="fill:var(--blue);opacity:${partial ? .4 : 1}"/>
          <text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${d.date}${partial ? "*" : ""}</text>`;
  });

  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:380px" role="img">${g}</svg></div>`;
}

const spark = h =>
  h.length < 2
    ? `<div class="sub">Needs 2+ daily reports. Run run_all.py each day and this fills in.</div>`
    : line(h.map(x => ({ x: x.date.slice(5), y: x.shortfall })), { c: "var(--red)", f: v => fmt(Math.round(v)) });

/* ---------- One section per order ---------- */
const out = D.latest.orders.map(o => {
  const [c, lab, em] = risk(o.ship_risk);
  const S = D.series[o.order];
  const q = o.quality;
  const opt = o.options_remaining_shortfall;
  const LE = D.lineEff[o.order] || {};

  const full = S.filter(d => d.lines >= TL);
  const effPts = full.map(d => ({ x: d.date, y: Math.round(d.actual / d.planned * 1000) / 10 }));
  const dhuPts = S.map(d => ({ x: d.date, y: Math.round(d.defects / d.actual * 1000) / 10 }));
  const avgEff = effPts.length ? Math.round(effPts.reduce((a, d) => a + d.y, 0) / effPts.length) : 0;

  const all = {
    "Do nothing": o.shortfall,
    "2 hrs overtime/day": opt["2h_overtime_per_day"],
    "Work Friday": opt.work_friday,
    "Friday + 2 hrs OT": opt.friday_plus_2h_overtime,
    "Friday + 3 hrs OT": opt.friday_plus_3h_overtime
  };
  const fix = Object.entries(all).find(([k, v], i) => i > 0 && v === 0);

  const loss = Object.entries(o.main_loss_reasons_pieces).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const lossTot = loss.reduce((a, e) => a + e[1], 0);
  const lowL = Object.entries(LE).sort((a, b) => a[1] - b[1])[0];
  const ready = Math.min(o.projected_ready, o.order_qty);
  const miss = Math.max(0, o.order_qty - o.projected_ready);

  /* Action list */
  const acts = [];
  o.material_problems.forEach(m =>
    acts.push(`<b>Call ${esc(m.supplier)}</b> about ${esc(m.item)}: ${fmt(m.balance)} ${esc(m.unit)} still missing. Ask for a part-shipment today.`));
  if (o.shortfall > 0) {
    acts.push(fix
      ? `<b>Decide today:</b> “${fix[0]}” can close the gap. Check cost and staff consent first.`
      : `<b>No single option closes the gap.</b> Combine overtime and Friday work, and talk to the buyer.`);
    acts.push(`<b>Warn the buyer early</b> about a partial shipment (about ${fmt(ready)} pcs on time, the rest later).`);
  }
  if (!acts.length) acts.push("<b>No action needed.</b> Keep monitoring daily.");

  /* Materials table */
  const mats = o.material_problems.length
    ? `<div class="scroll"><table>
         <tr><th>Item</th><th>Supplier</th><th>Status</th><th>Still missing</th><th>Note</th></tr>
         ${o.material_problems.map(m => `<tr>
           <td>${esc(m.item)}</td>
           <td>${esc(m.supplier)}</td>
           <td><span class="tag ${m.status == "LATE" ? "red" : "amber"}">${m.status}</span></td>
           <td>${fmt(m.balance)} ${esc(m.unit)}</td>
           <td>${esc(m.note)}</td>
         </tr>`).join("")}
       </table></div>`
    : `<div class="sub">No material problems 🎉</div>`;

  return `
<div class="sec">${esc(o.order)} · ${esc(o.style)}</div>

<div class="card hero ${c}">
  <div>
    <div class="lbl">Will it ship on time?</div>
    <div class="big">${em} Risk: ${lab}</div>
    <div class="sub">Ship date ${o.ship_date} · sewing must finish ${o.sewing_deadline}</div>
  </div>
  <div style="text-align:right">
    <div class="lbl">Pieces likely missing</div>
    <div class="big">${fmt(o.shortfall)}</div>
  </div>
</div>

<div class="kpis">
  <div class="card kpi"><div class="ic">✅</div><div class="lbl">Made so far</div><div class="big">${fmt(o.produced)}</div><div class="sub">of ${fmt(o.order_qty)} ordered</div></div>
  <div class="card kpi"><div class="ic">⚡</div><div class="lbl">Per day: needed vs running</div><div class="big">${o.needed_per_day} / ${o.current_per_day}</div><div class="sub">running at ${o.efficiency_pct}% of plan</div></div>
  <div class="card kpi"><div class="ic">🎯</div><div class="lbl">Defects per 100 pcs (DHU)</div><div class="big">${q.recent_dhu}</div><div class="sub">target ${q.target_dhu} · ~${q.expected_defects_in_remaining} to repair</div></div>
  <div class="card kpi"><div class="ic">📦</div><div class="lbl">Material alerts</div><div class="big">${o.material_problems.length}</div><div class="sub">${fmt(o.pieces_lost_waiting_material)} pcs lost waiting</div></div>
</div>

<div class="g2">
  <div class="card">
    <h2>Order progress</h2>
    <div class="sub">How much of the order will be ready by the sewing deadline</div>
    ${donut([
      { l: "Made so far", v: o.produced, c: "var(--blue)" },
      { l: "Expected to be made", v: Math.max(0, ready - o.produced), c: "var(--teal)" },
      { l: "Likely missing", v: miss, c: "var(--red)" }
    ], Math.round(ready / o.order_qty * 100) + "%", "ready")}
    <div class="tip">💡 Blue and teal are good. Red is the part that may miss the ship date.</div>
  </div>
  <div class="card">
    <h2>✅ What to do today</h2>
    <div class="sub">Plain steps from the 4 agents. The manager decides.</div>
    <ul class="acts">${acts.map((a, i) => `<li><b>${i + 1}</b><span>${a}</span></li>`).join("")}</ul>
  </div>
</div>

<div class="g2">
  <div class="card">
    <h2>Daily output: plan vs actual</h2>
    <div class="leg">
      <span><b style="background:var(--line)"></b>Planned</span>
      <span><b style="background:var(--blue)"></b>Actual</span>
      <span>* partial day</span>
    </div>
    ${bars2(S)}
    <div class="tip">💡 Blue bars shorter than grey bars mean the factory made less than planned.</div>
  </div>
  <div class="card">
    <h2>Efficiency trend (% of plan)</h2>
    <div class="sub">Full days only. Dotted line = 100% of plan.</div>
    ${line(effPts, { c: "var(--violet)", ref: 100, rl: "plan", min: 0, max: 110, f: v => Math.round(v) + "%" })}
    <div class="tip">💡 On average the factory made ${avgEff}% of its plan.</div>
  </div>
</div>

<div class="g2">
  <div class="card">
    <h2>Quality trend (DHU)</h2>
    <div class="sub">Defects per 100 pieces. Dotted line = target.</div>
    ${line(dhuPts, { c: "var(--teal)", ref: q.target_dhu, rl: "target", min: 0, f: v => v.toFixed(1) })}
    <div class="tip">💡 ${q.recent_dhu <= q.target_dhu ? "Quality is inside the target. Keep it there." : "Quality is above the target. Check the line with most defects."}</div>
  </div>
  <div class="card">
    <h2>Efficiency by line</h2>
    <div class="sub">Output ÷ plan for this order</div>
    ${Object.entries(LE).map(([k, v]) => `<div class="row"><span class="n">${esc(k)}</span><span class="t"><i style="width:${Math.min(v, 100)}%;background:${col(v)}"></i></span><span class="v">${v}%</span></div>`).join("")}
    <div class="tip">💡 ${lowL ? esc(lowL[0]) + " is the slowest line. Start there." : ""}</div>
  </div>
</div>

<div class="g2">
  <div class="card">
    <h2>Where pieces were lost</h2>
    <div class="sub">Estimate for the last 3 full days</div>
    ${donut(loss.map((e, i) => ({ l: nice(e[0]), v: e[1], c: PAL[i % PAL.length] })), fmt(lossTot), "pcs lost")}
    <div class="tip">💡 Biggest cause: ${loss[0] ? esc(nice(loss[0][0])) : "none"}. Fix this first.</div>
  </div>
  <div class="card">
    <h2>Recovery options</h2>
    <div class="sub">Pieces still missing after each option. Green = fully fixed.</div>
    ${Object.entries(all).map(([k, v]) => `<div class="row"><span class="n">${k}</span><span class="t"><i style="width:${o.shortfall ? v / o.shortfall * 100 : 0}%;background:${v == 0 ? "var(--green)" : "var(--amber)"}"></i></span><span class="v">${fmt(v)}</span></div>`).join("")}
    <div class="tip">💡 The agent does not know cost or worker consent. That is your decision.</div>
  </div>
</div>

<div class="g2">
  <div class="card"><h2>Materials needing attention</h2>${mats}</div>
  <div class="card">
    <h2>Pieces missing over time</h2>
    <div class="sub">Going down = recovering. Going up = getting worse.</div>
    ${spark(D.history[o.order])}
  </div>
</div>`;
}).join("");

/* ---------- Page shell ---------- */
const o0 = D.latest.orders[0];
const bad = D.latest.orders.filter(o => o.shortfall > 0).length;

document.getElementById("asof").textContent = "Data as of " + D.latest.as_of;

document.getElementById("app").innerHTML = `
<div class="welcome">
  <h1>স্বাগতম, Factory Manager 👋</h1>
  <p>${greet}! Here is your factory in one page.</p>
  <p>${bad
    ? `<strong>${bad} order${bad > 1 ? "s" : ""} need${bad > 1 ? "" : "s"} attention today.</strong> ${esc(o0.order)} may be short by about ${fmt(o0.shortfall)} pieces (${Math.round(o0.shortfall / o0.order_qty * 100)}%) on ship day.`
    : "<strong>All orders look on track today.</strong>"}</p>
  <div class="chips">
    <span>🟢 on track</span><span>🟡 keep watching</span><span>🔴 act today</span><span>💡 tips under each chart</span>
  </div>
</div>`
+ out
+ (D.brief
  ? `<div class="sec">Today’s message for the manager</div>
     <div class="card"><div class="sub">Ready to copy into WhatsApp</div><pre id="brief"></pre></div>`
  : "");

if (D.brief) document.getElementById("brief").textContent = D.brief;
document.getElementById("gen").textContent = "Report created " + D.generated;
</script>
</body>
</html>
